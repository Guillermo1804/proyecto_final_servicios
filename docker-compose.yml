      MS_AUTH_HTTP_URL: http://ms-auth:8001
      MS_AUTH_HTTP_TIMEOUT: "10"
      INTERNAL_API_KEY: cambiar-en-produccion
      DB_HOST: db-alumnos
      DB_PORT: '3306'
      DB_NAME: agm_alumnos_db
      DB_USER: root
      DB_PASSWORD: root_password
    ports:
      - "8003:8003"
      - "50053:50053"
    depends_on:
      db-alumnos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-auth:
        condition: service_healthy
    healthcheck:
      <<: *ms-healthcheck
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/')\""]
    networks:
      - agm-network

  ms-alumnos-outbox-worker:
    build:
      context: .
      dockerfile: ms-alumnos/Dockerfile
    container_name: agm-ms-alumnos-outbox
    environment:
      AGM_RUN_MODE: outbox-worker
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
    depends_on:
      db-alumnos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-alumnos:
        condition: service_healthy
    networks:
      - agm-network

  ms-alumnos-worker-consumer:
    build:
      context: .
      dockerfile: ms-alumnos/Dockerfile
    container_name: agm-ms-alumnos-consumer
    environment:
      AGM_RUN_MODE: event-consumer
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
    depends_on:
      db-alumnos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-alumnos:
        condition: service_healthy
    networks:
      - agm-network

  ms-calificaciones:
    build:
      context: .
      dockerfile: ms-calificaciones/Dockerfile
    container_name: agm-ms-calificaciones
    environment:
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
      JWT_JWKS_URL: http://ms-auth:8001/.well-known/jwks.json
      DB_HOST: db-calificaciones
      DB_PORT: '3306'
      DB_NAME: agm_calificaciones_db
      DB_USER: root
      DB_PASSWORD: root_password
    ports:
      - "8004:8004"
    depends_on:
      db-calificaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-auth:
        condition: service_healthy
    healthcheck:
      <<: *ms-healthcheck
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/')\""]
    networks:
      - agm-network

  ms-calificaciones-worker-outbox:
    build:
      context: .
      dockerfile: ms-calificaciones/Dockerfile
    container_name: agm-ms-calificaciones-outbox
    environment:
      AGM_RUN_MODE: event-outbox
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
    depends_on:
      db-calificaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-calificaciones:
        condition: service_healthy
    networks:
      - agm-network

  ms-calificaciones-worker-consumer:
    build:
      context: .
      dockerfile: ms-calificaciones/Dockerfile
    container_name: agm-ms-calificaciones-consumer
    environment:
      AGM_RUN_MODE: event-consumer
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
    depends_on:
      db-calificaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-calificaciones:
        condition: service_healthy
    networks:
      - agm-network

  ms-asistencias:
    build:
      context: .
      dockerfile: ms-asistencias/Dockerfile
    container_name: agm-ms-asistencias
    environment:
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
      JWT_JWKS_URL: http://ms-auth:8001/.well-known/jwks.json
      DB_HOST: db-asistencias
      DB_PORT: '3306'
      DB_NAME: agm_asistencias_db
      DB_USER: root
