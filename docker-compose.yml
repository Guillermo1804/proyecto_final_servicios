  ms-asistencias-worker-outbox:
    build:
      context: .
      dockerfile: ms-asistencias/Dockerfile
    container_name: agm-ms-asistencias-outbox
    environment:
      AGM_RUN_MODE: event-outbox
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
    depends_on:
