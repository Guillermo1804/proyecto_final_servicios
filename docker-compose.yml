      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
      DB_HOST: db-notificaciones
      DB_PORT: '3306'
      DB_NAME: agm_notificaciones_db
      DB_USER: root
      DB_PASSWORD: root_password
    ports:
      - "8006:8006"
    depends_on:
      db-notificaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *ms-healthcheck
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health/')\""]
    networks:
      - agm-network

  ms-notificaciones-worker-consumer:
    build:
      context: .
      dockerfile: ms-notificaciones/Dockerfile
    container_name: agm-ms-notificaciones-consumer
    environment:
      AGM_RUN_MODE: event-consumer
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
    depends_on:
      db-notificaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-notificaciones:
        condition: service_healthy
    networks:
      - agm-network

  ms-reportes:
    build:
      context: .
      dockerfile: ms-reportes/Dockerfile
    container_name: agm-ms-reportes
    environment:
      USE_EVENT_BUS: "true"
      JWT_JWKS_URL: http://ms-auth:8001/.well-known/jwks.json
      EVENT_CONTRACTS_DIR: /contracts/events
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-agm_bus}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-agm_bus_dev_change_me}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-agm}
      EVENT_EXCHANGE: agm.domain
      DB_HOST: db-reportes
      DB_PORT: '3306'
      DB_NAME: agm_reportes_db
      DB_USER: root
      DB_PASSWORD: root_password
    ports:
      - "8007:8007"
      - "50057:50057"
    depends_on:
      db-reportes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-auth:
        condition: service_healthy
    healthcheck:
      <<: *ms-healthcheck
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health/')\""]
    networks:
      - agm-network

  # Fase 8 — consumidor analítico MS-7 (proyecciones locales db-reportes)
  ms-reportes-worker-consumer:
    build:
      context: .
      dockerfile: ms-reportes/Dockerfile
    container_name: agm-ms-reportes-consumer
    environment:
      AGM_RUN_MODE: event-consumer
      USE_EVENT_BUS: "true"
      JWT_JWKS_URL: http://ms-auth:8001/.well-known/jwks.json
      EVENT_CONTRACTS_DIR: /contracts/events
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-agm_bus}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-agm_bus_dev_change_me}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-agm}
      EVENT_EXCHANGE: agm.domain
    depends_on:
      db-reportes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-reportes:
        condition: service_healthy
    networks:
      - agm-network

  nginx:
    image: nginx:1.25-alpine
    container_name: agm-nginx-gateway
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ms-auth:
        condition: service_healthy
      ms-periodos:
        condition: service_healthy
      ms-alumnos:
        condition: service_healthy
      ms-calificaciones:
        condition: service_healthy
      ms-asistencias:
        condition: service_healthy
      ms-notificaciones:
        condition: service_healthy
      ms-reportes:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - agm-network

# ============================================
# VOLUMES & NETWORKS
# ============================================

volumes:
  db_auth_data:
  db_periodos_data:
  db_alumnos_data:
  db_calificaciones_data:
  db_asistencias_data:
  db_notificaciones_data:
  db_reportes_data:
  redis_data:
  rabbitmq_data:

networks:
  agm-network:
    driver: bridge
