# =============================================
# AGM — docker-compose.yml (perfil completo / produccion local)
#
# Stack coordinado (docker compose up --build):
#   Infra: rabbitmq, redis, 7x MySQL (db-auth ... db-reportes)
#   API: ms-auth, ms-periodos, ms-alumnos, ms-calificaciones, ms-asistencias,
#        ms-notificaciones, ms-reportes, nginx (gateway :8080)
#   Outbox workers (5): ms-auth-outbox-worker, ms-periodos-outbox-worker,
#        ms-alumnos-outbox-worker, ms-calificaciones-worker-outbox,
#        ms-asistencias-worker-outbox
#   Consumer workers (7): ms-auth-event-consumer, ms-periodos-worker-consumer,
#        ms-alumnos-worker-consumer, ms-calificaciones-worker-consumer,
#        ms-asistencias-worker-consumer, ms-notificaciones-worker-consumer,
#        ms-reportes-worker-consumer
#
# Comando (Compose V2 plugin, recomendado):
#   docker compose up --build
# Alternativa (binario legacy):
#   docker-compose up --build
#
# Variables en cada ms-*/.env (desde .env.example):
#   DB_HOST = nombre del servicio de BD (ej. db-auth), puerto 3306 *interno*
#   MS_*_GRPC_HOST = nombre del contenedor del otro MS (ej. ms-auth)
#
# MySQL expuesto al host (depuración; dentro de Docker usar DB_HOST y puerto 3306):
#   db-auth → localhost:13307 … db-reportes → localhost:13313
#
# API Gateway Nginx en servicio `nginx` (puerto host 8080 → 80).
#
# Requisito: cada ./ms-* incluye Dockerfile + entrypoint.sh; copiar ms-*/.env desde .env.example.
# Healthcheck REST: GET /health/ en cada MS (Epic 1).
#
# Bus de eventos (Fase 1): servicio rabbitmq en agm-network.
# Smoke test desde host: docker compose up -d rabbitmq && python packages/agm_events/smoke_test.py
# =============================================

x-ms-healthcheck: &ms-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 60s

services:

  # ============================================
  # BASES DE DATOS
  # ============================================

  db-auth:
    image: mysql:8.0
    container_name: agm-db-auth
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_auth_db
    ports:
      - "13307:3306"
    volumes:
      - db_auth_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  db-periodos:
    image: mysql:8.0
    container_name: agm-db-periodos
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_periodos_db
    ports:
      - "13308:3306"
    volumes:
      - db_periodos_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  db-alumnos:
    image: mysql:8.0
    container_name: agm-db-alumnos
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_alumnos_db
    ports:
      - "13309:3306"
    volumes:
      - db_alumnos_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  db-calificaciones:
    image: mysql:8.0
    container_name: agm-db-calificaciones
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_calificaciones_db
    ports:
      - "13310:3306"
    volumes:
      - db_calificaciones_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  db-asistencias:
    image: mysql:8.0
    container_name: agm-db-asistencias
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_asistencias_db
    ports:
      - "13311:3306"
    volumes:
      - db_asistencias_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  db-notificaciones:
    image: mysql:8.0
    container_name: agm-db-notificaciones
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_notificaciones_db
    ports:
      - "13312:3306"
    volumes:
      - db_notificaciones_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  db-reportes:
    image: mysql:8.0
    container_name: agm-db-reportes
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_reportes_db
    ports:
      - "13313:3306"
    volumes:
      - db_reportes_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  # Bus de eventos — RabbitMQ (Fase 1+)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: agm-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-agm_bus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-agm_bus_dev_change_me}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-agm}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      # 5672: clientes AMQP (smoke test en host). 15672: consola management (solo dev).
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agm-network

  # Redis para MS-5 (sesiones QR en vivo)
  redis:
    image: redis:7-alpine
    container_name: agm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agm-network

  # ============================================
  # MICROSERVICIOS
  # ============================================

  ms-auth:
    build:
      context: .
      dockerfile: ms-auth/Dockerfile
    container_name: agm-ms-auth
    ports:
      - "8001:8001"
      - "50051:50051"
    environment:
      INTERNAL_API_KEY: cambiar-en-produccion
      USE_EVENT_BUS: "true"
      JWT_ALGORITHM: RS256
      EVENT_CONTRACTS_DIR: /contracts/events
      DB_HOST: db-auth
      DB_PORT: '3306'
      DB_NAME: agm_auth_db
      DB_USER: root
      DB_PASSWORD: root_password
    depends_on:
      db-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *ms-healthcheck
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/')\""]
    networks:
      - agm-network

  # Fase 2 — relay outbox MS-1 → RabbitMQ
  ms-auth-outbox-worker:
    build:
      context: .
      dockerfile: ms-auth/Dockerfile
    container_name: agm-ms-auth-outbox
    environment:
      AGM_RUN_MODE: outbox-worker
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
    depends_on:
      db-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-auth:
        condition: service_healthy
    networks:
      - agm-network

  # Fase 2 — consumidor MS-1 (user.create_requested.v1)
  ms-auth-event-consumer:
    build:
      context: .
      dockerfile: ms-auth/Dockerfile
    container_name: agm-ms-auth-consumer
    environment:
      AGM_RUN_MODE: event-consumer
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
    depends_on:
      db-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - agm-network

  ms-periodos:
    build:
      context: .
      dockerfile: ms-periodos/Dockerfile
    container_name: agm-ms-periodos
    environment:
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
      JWT_JWKS_URL: http://ms-auth:8001/.well-known/jwks.json
      DB_HOST: db-periodos
      DB_PORT: '3306'
      DB_NAME: agm_periodos_db
      DB_USER: root
      DB_PASSWORD: root_password
    ports:
      - "8002:8002"
      - "50052:50052"
    depends_on:
      db-periodos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-auth:
        condition: service_healthy
    healthcheck:
      <<: *ms-healthcheck
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/')\""]
    networks:
      - agm-network

  ms-periodos-outbox-worker:
    build:
      context: .
      dockerfile: ms-periodos/Dockerfile
    container_name: agm-ms-periodos-outbox
    environment:
      AGM_RUN_MODE: outbox-worker
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
    depends_on:
      db-periodos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-periodos:
        condition: service_healthy
    networks:
      - agm-network

  ms-periodos-worker-consumer:
    build:
      context: .
      dockerfile: ms-periodos/Dockerfile
    container_name: agm-ms-periodos-consumer
    environment:
      AGM_RUN_MODE: event-consumer
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
    depends_on:
      db-periodos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-periodos:
        condition: service_healthy
