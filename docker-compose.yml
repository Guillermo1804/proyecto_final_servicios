# =============================================
# AGM — docker-compose.yml
# Servicios: 7 MySQL 8 (utf8mb4) + Redis 7 + 7 microservicios Django + Nginx (gateway)
#
# Comando (Compose V2 plugin, recomendado):
#   docker compose up --build
# Alternativa (binario legacy):
#   docker-compose up --build
#
# Variables en cada ms-*/.env (desde .env.example):
#   DB_HOST = nombre del servicio de BD (ej. db-auth), puerto 3306 *interno*
#   MS_*_GRPC_HOST = nombre del contenedor del otro MS (ej. ms-auth)
#
# MySQL expuesto al host (depuración; dentro de Docker usar DB_HOST y puerto 3306):
#   db-auth → localhost:13307 … db-reportes → localhost:13313
#
# API Gateway Nginx en servicio `nginx` (puerto host 8080 → 80).
#
# Requisito: cada ./ms-* incluye Dockerfile + entrypoint.sh; copiar ms-*/.env desde .env.example.
# =============================================

services:

  # ============================================
  # BASES DE DATOS
  # ============================================

  db-auth:
    image: mysql:8.0
    container_name: agm-db-auth
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_auth_db
    ports:
      - "13307:3306"
    volumes:
      - db_auth_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  db-periodos:
    image: mysql:8.0
    container_name: agm-db-periodos
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_periodos_db
    ports:
      - "13308:3306"
    volumes:
      - db_periodos_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  db-alumnos:
    image: mysql:8.0
    container_name: agm-db-alumnos
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_alumnos_db
    ports:
      - "13309:3306"
    volumes:
      - db_alumnos_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  db-calificaciones:
    image: mysql:8.0
    container_name: agm-db-calificaciones
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_calificaciones_db
    ports:
      - "13310:3306"
    volumes:
      - db_calificaciones_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  db-asistencias:
    image: mysql:8.0
    container_name: agm-db-asistencias
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_asistencias_db
    ports:
      - "13311:3306"
    volumes:
      - db_asistencias_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  db-notificaciones:
    image: mysql:8.0
    container_name: agm-db-notificaciones
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_notificaciones_db
    ports:
      - "13312:3306"
    volumes:
      - db_notificaciones_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  db-reportes:
    image: mysql:8.0
    container_name: agm-db-reportes
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: agm_reportes_db
    ports:
      - "13313:3306"
    volumes:
      - db_reportes_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agm-network

  # Redis para MS-5 (sesiones QR en vivo)
  redis:
    image: redis:7-alpine
    container_name: agm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agm-network

  # ============================================
  # MICROSERVICIOS
  # ============================================

  ms-auth:
    build: ./ms-auth
    container_name: agm-ms-auth
    env_file: ./ms-auth/.env
    ports:
      - "8001:8001"
      - "50051:50051"
    depends_on:
      db-auth:
        condition: service_healthy
    networks:
      - agm-network

  ms-periodos:
    build: ./ms-periodos
    container_name: agm-ms-periodos
    env_file: ./ms-periodos/.env
    ports:
      - "8002:8002"
      - "50052:50052"
    depends_on:
      db-periodos:
        condition: service_healthy
    networks:
      - agm-network

  ms-alumnos:
    build: ./ms-alumnos
    container_name: agm-ms-alumnos
    env_file: ./ms-alumnos/.env
    ports:
      - "8003:8003"
      - "50053:50053"
    depends_on:
      db-alumnos:
        condition: service_healthy
    networks:
      - agm-network

  ms-calificaciones:
    build: ./ms-calificaciones
    container_name: agm-ms-calificaciones
    env_file: ./ms-calificaciones/.env
    ports:
      - "8004:8004"
      - "50054:50054"
    depends_on:
      db-calificaciones:
        condition: service_healthy
    networks:
      - agm-network

  ms-asistencias:
    build: ./ms-asistencias
    container_name: agm-ms-asistencias
    env_file: ./ms-asistencias/.env
    ports:
      - "8005:8005"
      - "50055:50055"
    depends_on:
      db-asistencias:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agm-network

  ms-notificaciones:
    build: ./ms-notificaciones
    container_name: agm-ms-notificaciones
    env_file: ./ms-notificaciones/.env
    ports:
      - "8006:8006"
      - "50056:50056"
    depends_on:
      db-notificaciones:
        condition: service_healthy
    networks:
      - agm-network

  ms-reportes:
    build: ./ms-reportes
    container_name: agm-ms-reportes
    env_file: ./ms-reportes/.env
    ports:
      - "8007:8007"
      - "50057:50057"
    depends_on:
      db-reportes:
        condition: service_healthy
    networks:
      - agm-network

  nginx:
    image: nginx:1.25-alpine
    container_name: agm-nginx-gateway
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ms-auth
      - ms-periodos
      - ms-alumnos
      - ms-calificaciones
      - ms-asistencias
      - ms-notificaciones
      - ms-reportes
    networks:
      - agm-network

# ============================================
# VOLUMES & NETWORKS
# ============================================

volumes:
  db_auth_data:
  db_periodos_data:
  db_alumnos_data:
  db_calificaciones_data:
  db_asistencias_data:
  db_notificaciones_data:
  db_reportes_data:
  redis_data:

networks:
  agm-network:
    driver: bridge
