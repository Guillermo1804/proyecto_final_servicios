      context: .
      dockerfile: ms-asistencias/Dockerfile
    container_name: agm-ms-asistencias-consumer
    environment:
      AGM_RUN_MODE: event-consumer
      USE_EVENT_BUS: "true"
      EVENT_CONTRACTS_DIR: /contracts/events
    depends_on:
      db-asistencias:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-asistencias:
        condition: service_healthy
    networks:
