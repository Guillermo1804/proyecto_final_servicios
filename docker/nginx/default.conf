# API Gateway AGM — enruta prefijos REST a cada microservicio (puertos internos 8001–8007).
# listen 80 = puerto *dentro* del contenedor (Coolify/Caddy enrutan aquí; no publicar host:80 en prod).
# Desarrollo: docker-compose.dev.yml mapea localhost:8080 → contenedor:80.
#
# resolver + proxy_pass con variable: DNS se resuelve en cada petición (contenedores
# recreados no dejan IP obsoleta). No usar rewrite+break antes de set: nginx no
# ejecuta el set y devuelve HTTP 500.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;

    # MS-4: cierre / lista bajo /materias/… (antes del prefijo genérico a MS-2)
    location ~ ^/materias/[^/]+/(cerrar|imprimir-lista)/?$ {
        set $u_ms_cal http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal;
    }

    # MS-1: set antes de rewrite break
    location /auth/ {
        set $backend_auth ms-auth:8001;
        rewrite ^(/auth/.+?)/$ $1 break;
        proxy_pass http://$backend_auth;
    }

    location /usuarios {
        set $backend_auth2 ms-auth:8001;
        rewrite ^(/usuarios.*?)/$ $1 break;
        proxy_pass http://$backend_auth2;
    }

    # MS-2 / MS-3: rewrite + proxy_pass al host (conserva ?page=&limit= con variables)
    location /periodos/ {
        set $backend_periodos ms-periodos:8002;
        rewrite ^/periodos(/.*)$ /api/periodos$1 break;
        proxy_pass http://$backend_periodos;
    }

    location /materias/ {
        set $backend_periodos2 ms-periodos:8002;
        rewrite ^/materias(/.*)$ /api/materias$1 break;
        proxy_pass http://$backend_periodos2;
    }

    location /docentes/ {
        set $backend_alumnos ms-alumnos:8003;
        rewrite ^/docentes(/.*)$ /api/docentes$1 break;
        proxy_pass http://$backend_alumnos;
    }

    location /alumnos/ {
        set $backend_alumnos2 ms-alumnos:8003;
        rewrite ^/alumnos(/.*)$ /api/alumnos$1 break;
        proxy_pass http://$backend_alumnos2;
    }

    # MS-4: sin barra final obligatoria (evita 301 en OPTIONS/POST → fallo CORS en el navegador)
    location /ponderaciones {
        set $u_ms_cal2 http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal2;
    }

    location /actividades {
        set $u_ms_cal3 http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal3;
    }

    location /calificaciones {
        set $u_ms_cal4 http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal4;
    }

    location /concentrado {
        set $u_ms_cal5 http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal5;
    }

    # MS-5: host sin esquema en $variable (igual que periodos) para que rewrite+break aplique /api/...
    location /sesiones/ {
        set $backend_asistencias ms-asistencias:8005;
        rewrite ^/sesiones(/.*)$ /api/sesiones$1 break;
        proxy_pass http://$backend_asistencias;
    }

    location /registros/ {
        set $backend_asistencias ms-asistencias:8005;
        rewrite ^/registros(/.*)$ /api/registros$1 break;
        proxy_pass http://$backend_asistencias;
    }

    location /qr/ {
        set $backend_asistencias ms-asistencias:8005;
        rewrite ^/qr(/.*)$ /api/qr$1 break;
        proxy_pass http://$backend_asistencias;
    }

    location /asistencias/ {
        set $backend_asistencias ms-asistencias:8005;
        rewrite ^/asistencias(/.*)$ /api/asistencias$1 break;
        proxy_pass http://$backend_asistencias;
    }

    location /notificaciones/ {
        set $u_ms_not http://ms-notificaciones:8006;
        proxy_pass $u_ms_not;
    }

    location /reportes/ {
        set $u_ms_rep http://ms-reportes:8007;
        proxy_pass $u_ms_rep;
    }

    location /estadisticas/ {
        set $u_ms_rep2 http://ms-reportes:8007;
        proxy_pass $u_ms_rep2;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"agm-nginx-gateway"}';
    }

    # Frontend Angular (SPA) — mismo origen que la API (apiBaseUrl vacío en producción)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
