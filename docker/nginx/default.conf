        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_cal4 http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal4;
    }

    location /concentrado/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_cal5 http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal5;
    }

    location /sesiones/ {
