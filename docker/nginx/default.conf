# API Gateway AGM — enruta prefijos REST a cada microservicio (puertos internos 8001–8007).
# El cliente usa http://localhost:8080/<prefijo>/...
# gRPC entre MS no pasa por Nginx (sigue en red Docker 50051–50057).
#
# Resolver DNS de Docker (127.0.0.11) + proxy_pass con variable: los upstreams se
# resuelven al atender la petición, así Nginx puede arrancar aunque los MS aún no existan.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;

    # MS-4: cierre / lista bajo /materias/… (antes del prefijo genérico a MS-2)
    location ~ ^/materias/[^/]+/(cerrar|imprimir-lista)/?$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_cal http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal;
    }

    location /auth/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_auth http://ms-auth:8001;
        proxy_pass $u_ms_auth;
    }

    location /usuarios/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_auth2 http://ms-auth:8001;
        proxy_pass $u_ms_auth2;
    }

    location /periodos/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_per http://ms-periodos:8002;
        proxy_pass $u_ms_per;
    }

    location /materias/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_per2 http://ms-periodos:8002;
        proxy_pass $u_ms_per2;
    }

    location /docentes/ {
