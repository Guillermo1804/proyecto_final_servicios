# API Gateway AGM — enruta prefijos REST a cada microservicio (puertos internos 8001–8007).
# El cliente usa http://localhost:8080/<prefijo>/...
# gRPC entre MS no pasa por Nginx (sigue en red Docker 50051–50057).
#
# Resolver DNS de Docker (127.0.0.11) + proxy_pass con variable: los upstreams se
# resuelven al atender la petición, así Nginx puede arrancar aunque los MS aún no existan.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;

    # MS-4: cierre / lista bajo /materias/… (antes del prefijo genérico a MS-2)
    location ~ ^/materias/[^/]+/(cerrar|imprimir-lista)/?$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_cal http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal;
    }

    # MS-1: rutas sin barra final (auth/login). Quita trailing slash antes del proxy.
    location /auth/ {
        rewrite ^(/auth/.+?)/$ $1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms-auth:8001;
    }

    location /usuarios {
        rewrite ^(/usuarios.*?)/$ $1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms-auth:8001;
    }

    # MS-2: Django monta APIs bajo /api/ (proxy_pass estático: compatible con rewrite break)
    location /periodos/ {
        rewrite ^/periodos/(.*)$ /api/periodos/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms-periodos:8002;
    }

    location /materias/ {
        rewrite ^/materias/(.*)$ /api/materias/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms-periodos:8002;
    }

    # MS-3: Django monta APIs bajo /api/
    location /docentes/ {
        rewrite ^/docentes/(.*)$ /api/docentes/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms-alumnos:8003;
    }

    location /alumnos/ {
        rewrite ^/alumnos/(.*)$ /api/alumnos/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms-alumnos:8003;
    }

    location /ponderaciones/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_cal2 http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal2;
    }

    location /actividades/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_cal3 http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal3;
    }

    location /calificaciones/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_cal4 http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal4;
    }

    location /concentrado/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_cal5 http://ms-calificaciones:8004;
        proxy_pass $u_ms_cal5;
    }

    # MS-5: Django monta APIs bajo /api/
    location /sesiones/ {
        rewrite ^/sesiones/(.*)$ /api/sesiones/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms-asistencias:8005;
    }

    location /qr/ {
        rewrite ^/qr/(.*)$ /api/qr/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms-asistencias:8005;
    }

    location /registros/ {
        rewrite ^/registros/(.*)$ /api/registros/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms-asistencias:8005;
    }

    location /asistencias/ {
        rewrite ^/asistencias/(.*)$ /api/asistencias/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms-asistencias:8005;
    }

    location /notificaciones/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_not http://ms-notificaciones:8006;
        proxy_pass $u_ms_not;
    }

    location /reportes/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_rep http://ms-reportes:8007;
        proxy_pass $u_ms_rep;
    }

    location /estadisticas/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_rep2 http://ms-reportes:8007;
        proxy_pass $u_ms_rep2;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"agm-nginx-gateway"}';
    }

    location = / {
        default_type text/plain;
        return 200 'AGM API Gateway (Nginx) — ver README.md\n';
    }
}
