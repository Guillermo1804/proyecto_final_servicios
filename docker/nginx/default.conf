# API Gateway AGM — enruta prefijos REST a cada microservicio (puertos internos 8001–8007).
# El cliente usa http://localhost:8080/<prefijo>/...
# gRPC entre MS no pasa por Nginx (sigue en red Docker 50051–50057).

upstream ms_auth_upstream { server ms-auth:8001; }
upstream ms_periodos_upstream { server ms-periodos:8002; }
upstream ms_alumnos_upstream { server ms-alumnos:8003; }
upstream ms_calificaciones_upstream { server ms-calificaciones:8004; }
upstream ms_asistencias_upstream { server ms-asistencias:8005; }
upstream ms_notificaciones_upstream { server ms-notificaciones:8006; }
upstream ms_reportes_upstream { server ms-reportes:8007; }

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;

    # MS-4: cierre / lista bajo /materias/… (antes del prefijo genérico a MS-2)
    location ~ ^/materias/[^/]+/(cerrar|imprimir-lista)/?$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_calificaciones_upstream;
    }

    location /auth/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_auth_upstream;
    }

    location /usuarios/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_auth_upstream;
    }

    location /periodos/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_periodos_upstream;
    }

    location /materias/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_periodos_upstream;
    }

    location /docentes/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_alumnos_upstream;
    }

    location /alumnos/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_alumnos_upstream;
    }

    location /ponderaciones/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_calificaciones_upstream;
    }

    location /actividades/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_calificaciones_upstream;
    }

    location /calificaciones/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_calificaciones_upstream;
    }

    location /concentrado/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_calificaciones_upstream;
    }

    location /sesiones/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_asistencias_upstream;
    }

    location /qr/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_asistencias_upstream;
    }

    location /asistencias/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://ms_asistencias_upstream;
    }

    location /notificaciones/ {
