        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_not http://ms-notificaciones:8006;
        proxy_pass $u_ms_not;
    }

    location /reportes/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_rep http://ms-reportes:8007;
        proxy_pass $u_ms_rep;
    }

    location /estadisticas/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        set $u_ms_rep2 http://ms-reportes:8007;
        proxy_pass $u_ms_rep2;
    }

    location = / {
        default_type text/plain;
        return 200 'AGM API Gateway (Nginx) — ver README.md\n';
    }
}
