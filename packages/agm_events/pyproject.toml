[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agm-events"
version = "0.1.0"
description = "Libreria comun de bus de eventos AGM (RabbitMQ, outbox/inbox)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pika>=1.3,<2.0",
  "jsonschema>=4.21,<5.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agm_events*"]
