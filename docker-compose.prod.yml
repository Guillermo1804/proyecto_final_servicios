# Perfil producción (Ubuntu / Coolify / VPS).
# Uso:
#   cp .env.example .env
#   # Copiar ms-*/.env desde .env.example y ajustar secretos SMTP/JWT
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Sin puertos publicados en el host: Coolify/Caddy ocupan 80/443; el proxy enruta a nginx:80 en la red Docker.
# Desarrollo local: docker-compose.yml + docker-compose.dev.yml (gateway en localhost:8080).

