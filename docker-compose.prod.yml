# Perfil producción (Ubuntu / Coolify / VPS).
# Uso:
#   cp .env.example .env
#   # Copiar ms-*/.env desde .env.example y ajustar secretos SMTP/JWT
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Sin puertos en microservicios/BD. Entrada pública: servicio `caddy` (80/443) → nginx:80 en agm-network.
# Desarrollo local: docker-compose.yml + docker-compose.dev.yml (gateway en localhost:8080, sin Caddy).

services:
  db-auth:
    ports: []
  db-periodos:
    ports: []
  db-alumnos:
    ports: []
  db-calificaciones:
    ports: []
  db-asistencias:
    ports: []
  db-notificaciones:
    ports: []
  db-reportes:
    ports: []
  redis:
    ports: []
  rabbitmq:
    ports: []
  ms-auth:
    ports: []
  ms-periodos:
    ports: []
  ms-alumnos:
    ports: []
  ms-calificaciones:
    ports: []
  ms-asistencias:
    ports: []
  ms-notificaciones:
    ports: []
  ms-reportes:
    ports: []
  nginx:
    ports: []

  caddy:
    image: caddy:2-alpine
    container_name: agm-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AGM_DOMAIN: ${AGM_DOMAIN:-agm.aurelyte.iokoia.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - agm-network

volumes:
  caddy_data:
  caddy_config:
