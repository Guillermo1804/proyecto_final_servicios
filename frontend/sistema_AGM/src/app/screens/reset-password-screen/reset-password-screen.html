<div class="auth-page">
  <section class="auth-card">
    <p class="eyebrow">Restablecer contraseña</p>
    <h1>Crear nueva contraseña</h1>
    <p class="subtitle">Elige una contraseña nueva para continuar.</p>

    <form (ngSubmit)="resetPassword()" novalidate>
      <label for="password">Nueva contraseña</label>
      <div class="input-wrapper">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          autocomplete="new-password"
        >

        <button
          type="button"
          class="toggle-password"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>

      <label for="confirmPassword">Confirmar contraseña</label>
      <div class="input-wrapper">
        <input
          id="confirmPassword"
          [type]="showConfirmPassword ? 'text' : 'password'"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="••••••••"
          autocomplete="new-password"
        >

        <button
          type="button"
          class="toggle-password"
          (click)="toggleConfirmPassword()"
          [attr.aria-label]="showConfirmPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>

      <p *ngIf="message" class="message">{{ message }}</p>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Guardando...' : 'Guardar contraseña' }}
      </button>
    </form>

    <a routerLink="/login" class="back-link">Volver al login</a>
  </section>
</div>
