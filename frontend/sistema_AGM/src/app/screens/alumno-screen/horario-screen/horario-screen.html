<div class="horario-page">

  <app-topbar-admin></app-topbar-admin>

  <main class="content">

    <section class="hero">
      <h1>Mi horario</h1>
      <p>Materias inscritas en el periodo activo.</p>
    </section>

    <p *ngIf="loading">Cargando…</p>

    <section class="schedule-list">

      <article
        class="schedule-item"
        *ngFor="let item of horarios"
        [ngClass]="item.color"
      >

        <div class="hour">
          {{ item.hora }}
        </div>

        <div class="subject-card">
          <h3>{{ item.materia }}</h3>
          <span class="room-badge">{{ item.aula }}</span>
        </div>

      </article>

    </section>

  </main>

  <app-bottom-navbar-alumno></app-bottom-navbar-alumno>

</div>
