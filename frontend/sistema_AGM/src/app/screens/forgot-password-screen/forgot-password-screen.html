<div class="auth-page">
  <section class="auth-card">
    <p class="eyebrow">Recuperación de acceso</p>
    <h1>¿Olvidaste tu contraseña?</h1>
    <p class="subtitle">Escribe tu correo institucional y te enviaremos el enlace de recuperación.</p>

    <form (ngSubmit)="sendResetLink()" novalidate>
      <label for="email">Correo universitario</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="nombre@buap.mx"
        autocomplete="username"
      >

      <p *ngIf="message" class="message">{{ message }}</p>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Enviar enlace' }}
      </button>
    </form>

    <a routerLink="/login" class="back-link">Volver al login</a>
  </section>
</div>
