syntax = "proto3";

package agm.notificaciones;

import "agm_common.proto";

option java_multiple_files = true;
option java_package = "com.agm.notificaciones";

// =============================================
// MS-6: Notificaciones — EXPOSICIÓN gRPC (puerto 50056)
// =============================================
// Correos transaccionales. Seguridad: agm.common.PasswordResetDelivery.
// Llamadas REST internas: X-Internal-Api-Key o JWT admin (JWKS MS-1).

service NotificacionesService {
  rpc SendBienvenida (SendBienvenidaRequest) returns (SendResponse);
  rpc SendBajaNotif (SendBajaRequest) returns (SendResponse);
  rpc SendCierreMateria (SendCierreMateriaRequest) returns (SendResponse);
  rpc SendResetPassword (SendResetPasswordRequest) returns (SendResponse);
}

message SendResponse {
  bool success = 1;
  string message = 2;
}

message SendBienvenidaRequest {
  int32 alumno_id = 1;
  int32 materia_id = 2;
  string clave_acceso = 3;
}

message SendBajaRequest {
  int32 alumno_id = 1;
  int32 docente_id = 2;
  int32 materia_id = 3;
}

message SendCierreMateriaRequest {
  int32 materia_id = 1;
}

message SendResetPasswordRequest {
  agm.common.PasswordResetDelivery delivery = 1;
}
