syntax = "proto3";

package agm.auth;

import "agm_common.proto";

option java_multiple_files = true;
option java_package = "com.agm.auth";

// =============================================
// MS-1: Auth & Users — EXPOSICIÓN gRPC (puerto 50051)
// =============================================

service AuthService {
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUserById (GetUserByIdRequest) returns (UserProfile);
  rpc CheckRole (CheckRoleRequest) returns (CheckRoleResponse);
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
}

// ---------- ValidateToken (firma RPC dedicada; payload en agm.common) ----------

message ValidateTokenRequest {
  agm.common.AccessTokenCredential credential = 1;
}

message ValidateTokenResponse {
  agm.common.TokenValidationResult result = 1;
}

message GetUserByIdRequest {
  int32 user_id = 1;
}

message UserProfile {
  agm.common.UserClaims claims = 1;
  bool activo = 2;
}

message CheckRoleRequest {
  int32 user_id = 1;
  string role = 2;
}

message CheckRoleResponse {
  bool has_role = 1;
}

message CreateUserRequest {
  string email = 1;
  string nombre = 2;
  string rol = 3;
  string password = 4;
}

message CreateUserResponse {
  bool success = 1;
  int32 user_id = 2;
  string message = 3;
}
